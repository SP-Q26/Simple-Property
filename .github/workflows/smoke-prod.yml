name: smoke-prod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apex-smoke:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run audit
      - name: Live smoke (simple-property.com)
        env:
          SPT_SMOKE_URL: https://simple-property.com
        run: |
          node scripts/smoke-prod.mjs
          node scripts/smoke-prod-states-blogs.mjs
          node scripts/smoke-statute-urls.mjs
          node scripts/smoke-prod-magic-link.mjs
